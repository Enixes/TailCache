<text x="315.0" y="509" text-anchor="middle" class="axis-label">Retained Application Ballast (and Caffeine Post-GC Heap Occupancy)</text>
<text x="28" y="300.0" text-anchor="middle" transform="rotate(-90 28 300.0)" class="axis-label">Total GC Pause Time in 8s (ms)</text>
<rect x="635" y="145" width="435" height="310" fill="#fcfdff" stroke="#cbd5e1"/>
<text x="852.5" y="131" text-anchor="middle" class="panel-title">B. Worker Heap Allocation per Operation (4 KiB Workload)</text>
<line x1="635" y1="455.0" x2="1070" y2="455.0" class="grid"/>
<text x="627" y="459.0" text-anchor="end" class="tick">0 B/op</text>
<line x1="635" y1="387.6" x2="1070" y2="387.6" class="grid"/>
