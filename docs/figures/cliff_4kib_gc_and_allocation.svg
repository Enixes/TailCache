<line x1="635" y1="185.4" x2="1070" y2="185.4" class="grid"/>
<text x="627" y="189.4" text-anchor="end" class="tick">4000 B/op</text>
<rect x="687" y="441.1" width="70" height="13.9" fill="#dc2626" rx="4"/>
<text x="722" y="421.1" text-anchor="middle" class="annot" fill="#dc2626">205.6 B/op</text>
<text x="722" y="435.1" text-anchor="middle" class="tick" fill="#475569">(5% writes only)</text>
<text x="722" y="475" text-anchor="middle" class="axis-label">Caffeine</text>
<text x="722" y="491" text-anchor="middle" class="tick">Heap @352M: 98.2%</text>
<rect x="817" y="177.2" width="70" height="277.8" fill="#d97706" rx="4"/>
<text x="852" y="157.2" text-anchor="middle" class="annot" fill="#d97706">4121.6 B/op</text>
<text x="852" y="171.2" text-anchor="middle" class="tick" fill="#475569">(95% reads + 5% writes!)</text>
<text x="852" y="475" text-anchor="middle" class="axis-label">Chronicle get()</text>
<text x="852" y="491" text-anchor="middle" class="tick">Heap @352M: 71.9%</text>
<rect x="947" y="440.5" width="70" height="14.5" fill="#059669" rx="4"/>
<text x="982" y="420.5" text-anchor="middle" class="annot" fill="#059669">215.2 B/op</text>
<text x="982" y="434.5" text-anchor="middle" class="tick" fill="#475569">(5% writes only; 0 B/read)</text>
<text x="982" y="475" text-anchor="middle" class="axis-label">Chronicle getUsing()</text>
<text x="982" y="491" text-anchor="middle" class="tick">Heap @352M: 71.9%</text>
</svg>