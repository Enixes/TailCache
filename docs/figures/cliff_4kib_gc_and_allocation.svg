<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="540" viewBox="0 0 1140 540">
<style>
  text { font-family: "Inter", "Segoe UI", "DejaVu Sans", Arial, sans-serif; fill: #1e293b; }
  .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
  .subtitle { font-size: 12.5px; font-weight: 400; fill: #475569; }
  .panel-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .axis-label { font-size: 12px; font-weight: 600; fill: #334155; }
  .tick { font-size: 11px; fill: #475569; }
  .annot { font-size: 11px; font-weight: 600; }
  .legend { font-size: 12px; font-weight: 600; fill: #1e293b; }
  .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3,3; }
  .axis { stroke: #64748b; stroke-width: 1.5; }
</style>
<rect x="0" y="0" width="1140" height="540" fill="#ffffff" rx="8"/>
<text x="570" y="32" text-anchor="middle" class="title">4 KiB Payloads: Total STW GC Pause Time, Full GC Count, and Per-Operation Allocation</text>
<text x="570" y="52" text-anchor="middle" class="subtitle">Why Chronicle getUsing() wins by 2,418x: it eliminates both Caffeine's 98% retained-heap cliff and Chronicle get()'s 4.1 KiB/op read allocation</text>
<rect x="110" y="66" width="920" height="36" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
<line x1="134" y1="84" x2="160" y2="84" stroke="#dc2626" stroke-width="3"/>
<circle cx="147" cy="84" r="4.5" fill="#dc2626"/>
<text x="168" y="88" class="legend">Caffeine (On-Heap)</text>
<line x1="350" y1="84" x2="376" y2="84" stroke="#d97706" stroke-width="3"/>
<circle cx="363" cy="84" r="4.5" fill="#d97706"/>
<text x="384" y="88" class="legend">Chronicle Map get() (Off-Heap, Allocating)</text>
<line x1="685" y1="84" x2="711" y2="84" stroke="#059669" stroke-width="3"/>
<circle cx="698" cy="84" r="4.5" fill="#059669"/>
<text x="719" y="88" class="legend">Chronicle Map getUsing() (Off-Heap, Zero-Alloc Read)</text>
<rect x="90" y="145" width="450" height="310" fill="#fcfdff" stroke="#cbd5e1"/>
<text x="315.0" y="131" text-anchor="middle" class="panel-title">A. Total Stop-The-World GC Pause Time (ms per 8s Window)</text>
