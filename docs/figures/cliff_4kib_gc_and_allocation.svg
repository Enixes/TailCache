<rect x="282.0" y="407.3" width="20" height="47.7" fill="#dc2626" rx="2"/>
<text x="292.0" y="401.3" text-anchor="middle" class="annot" fill="#dc2626">385ms (2 Full)</text>
<rect x="305.0" y="422.1" width="20" height="32.9" fill="#d97706" rx="2"/>
