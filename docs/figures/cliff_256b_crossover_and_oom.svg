<text x="570" y="52" text-anchor="middle" class="subtitle">In Task 12, 256 B never exceeded 62% heap. On a 256 MiB heap, Caffeine hits 529 Full GCs at 232 MiB and OOMs at 238 MiB while Chronicle survives</text>
